<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="Revolutionary States flag: a black canton with a white gear, star and crossed hammer and pick, against diagonal red and white stripes">
  <defs>
    <pattern id="rsa-stripes" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(51)">
      <rect width="64" height="64" fill="#c81e2c"/>
      <rect width="32" height="64" fill="#f3efe2"/>
    </pattern>
  </defs>
  <rect width="900" height="540" fill="url(#rsa-stripes)"/>
  <!-- white bevel band between the black canton and the stripes -->
  <polygon points="0,0 810,0 195,540 0,540" fill="#f3efe2"/>
  <!-- black canton -->
  <polygon points="0,0 765,0 150,540 0,540" fill="#0c0c0c"/>
  <!-- gear with star above and crossed hammer and pick -->
  <g transform="translate(215,255)">
    <circle r="98" fill="none" stroke="#f3efe2" stroke-width="15" stroke-dasharray="17 15.5"/>
    <circle r="98" fill="none" stroke="#f3efe2" stroke-width="4"/>
    <circle r="72" fill="#0c0c0c" stroke="#f3efe2" stroke-width="4"/>
    <path transform="translate(0,-165)" fill="#f3efe2" d="M0 -34 L12.6 -10.5 L39.6 -10.5 L18.6 5.4 L27 31.2 L0 15 L-27 31.2 L-18.6 5.4 L-39.6 -10.5 L-12.6 -10.5 Z"/>
    <g stroke="#f3efe2" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="-40" y1="-40" x2="40" y2="40"/>
      <line x1="40" y1="-40" x2="-40" y2="40"/>
    </g>
    <g fill="#f3efe2">
      <path d="M-40 -40 l14 -14 l9 9 l-14 14 z"/>
      <path d="M40 -40 l7 -18 l14 5 l-7 18 l-9 3 z"/>
    </g>
  </g>
</svg>
