<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Page Not Found | The Divided States</title>
	<meta name="robots" content="noindex, follow" />
	<link rel="icon" href="/wp-content/uploads/2020/10/cropped-Divided-States-Website-Favicon-32x32.png" sizes="32x32" />
	<link rel="apple-touch-icon" href="/wp-content/uploads/2020/10/cropped-Divided-States-Website-Favicon-180x180.png" />
	<style>
		:root { --bg:#0a0a0a; --fg:#e8e8e8; --muted:#9a9a9a; --line:#2a2a2a; --accent:#c0392b; }
		* { box-sizing:border-box; }
		html,body { height:100%; }
		body {
			margin:0; background:var(--bg); color:var(--fg);
			font-family:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
			display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem;
		}
		.wrap { max-width:640px; }
		.logo { max-width:260px; width:70%; height:auto; margin:0 auto 2rem; display:block; opacity:.95; }
		.code { font-size:clamp(3rem,12vw,6rem); font-weight:700; letter-spacing:.05em; margin:0 0 .25rem; }
		h1 { font-size:1.4rem; font-weight:600; margin:0 0 1rem; }
		p { color:var(--muted); line-height:1.6; margin:0 auto 2rem; max-width:46ch; }
		.actions { display:flex; gap:.75rem; flex-wrap:wrap; justify-content:center; }
		a.btn {
			display:inline-block; padding:.75rem 1.5rem; border:1px solid var(--line);
			color:var(--fg); text-decoration:none; border-radius:2px; transition:all .15s ease;
			font-size:.95rem; letter-spacing:.02em;
		}
		a.btn:hover { border-color:var(--accent); color:#fff; }
		a.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
		a.btn.primary:hover { filter:brightness(1.1); }
	</style>
</head>
<body>
	<main class="wrap">
		<img class="logo" src="/wp-content/uploads/2020/07/Divided-States-Logo-PSD.png" alt="The Divided States" />
		<p class="code">404</p>
		<h1>This front has fallen quiet.</h1>
		<p>The page you were looking for couldn&rsquo;t be found. It may have been moved, or never existed in this timeline.</p>
		<div class="actions">
			<a class="btn primary" href="/">Return home</a>
			<a class="btn" href="/episodes/">Watch episodes</a>
			<a class="btn" href="https://flagmaker-print.com/" rel="noopener" target="_blank">Get the flags</a>
		</div>
	</main>
</body>
</html>
